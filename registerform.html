<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form | Michael Luis T. Ramos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* Design System Variables */
    :root {
      --bg-base: #0b1220;
      --bg-surface: #131e32;
      --bg-nav: rgba(19, 30, 50, 0.8);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --border-color: rgba(255, 255, 255, 0.1);
      --input-bg: rgba(255, 255, 255, 0.03);
      --font-body: 'DM Sans', sans-serif;
      --font-heading: 'Manrope', sans-serif;
      --transition: 0.3s ease;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-base);
      color: var(--text-main);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Portal Header */
    .portal-header {
      background: var(--bg-surface);
      padding: 3rem 2rem;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
    }

    .portal-header h1 {
      font-family: var(--font-heading);
      font-size: 2rem;
      color: var(--accent);
    }

    /* Navigation */
    .site-nav {
      background: var(--bg-nav);
      backdrop-filter: blur(10px);
      padding: 1rem 0;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-links {
      display: flex;
      justify-content: center;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 500;
      transition: color var(--transition);
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    .nav-links .active {
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.3rem 1rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
    }

    /* Form Layout */
    .form-wrapper {
      padding: 4rem 0;
      flex-grow: 1;
      display: flex;
      justify-content: center;
    }

    .form-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 3rem;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 550px; /* Matched to the image's proportions */
    }

    .form-group {
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: flex-start; /* Left-aligned structure */
      width: 100%;
    }

    .form-group label {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    /* Inputs (Full width) */
    input[type="text"],
    input[type="email"],
    select {
      width: 100%;
      padding: 0.8rem 1rem;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 1rem;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    input[type="text"]::placeholder,
    input[type="email"]::placeholder {
      color: var(--text-muted);
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    select {
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 1rem center;
      background-size: 1em;
    }

    select option {
      background: var(--bg-surface);
      color: var(--text-main);
    }

    /* Radios & Checkboxes (Inline) */
    .inline-group {
      display: flex;
      gap: 1.5rem;
      width: 100%;
      margin-top: 0.2rem;
    }

    .check-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      font-weight: 400;
      color: var(--text-main);
    }

    input[type="radio"],
    input[type="checkbox"] {
      accent-color: var(--accent);
      width: 1.1rem;
      height: 1.1rem;
      cursor: pointer;
    }

    /* File Upload Box */
    .file-upload-box {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--input-bg);
      display: flex;
      align-items: center;
    }

    input[type="file"] {
      color: var(--text-muted);
      font-size: 0.95rem;
      width: 100%;
    }
    
    input[type="file"]::file-selector-button {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.4rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 1rem;
      font-family: var(--font-body);
      transition: background var(--transition);
    }

    input[type="file"]::file-selector-button:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Submit Button (Full width) */
    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 1rem;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: 600;
      font-family: var(--font-body);
      cursor: pointer;
      transition: background var(--transition), transform var(--transition);
      margin-top: 1.5rem;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    /* Footer */
    .site-footer {
      text-align: center;
      padding: 2rem 0;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .nav-links { flex-wrap: wrap; }
      .form-card { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="portal-header">
    <div class="container">
      <h1>Welcome to my Personal Student Portal</h1>
    </div>
  </header>

  <!-- Navigation -->
  <nav class="site-nav">
    <div class="container">
      <ul class="nav-links">
       <li><a href="index.html">Home</a></li>
        <li><a href="registerform.html">Registration Form</a></li>
        <li><a href="grades.html">Grades</a></li>
        <li><a href="profile.html">My Profile</a></li>
      </ul>
    </div>
  </nav>

  <div class="container form-wrapper">
    <form class="form-card" action="#" method="POST">
      
      <div class="form-group">
        <label for="studentName">Student Name:</label>
        <input type="text" id="studentName" name="studentName" placeholder="Enter your name" required>
      </div>

      <div class="form-group">
        <label for="studentNumber">Student Number:</label>
        <input type="text" id="studentNumber" name="studentNumber" placeholder="Enter your student number" required>
      </div>

      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label>Gender:</label>
        <div class="inline-group">
          <label class="check-label">
            <input type="radio" name="gender" value="Male"> Male
          </label>
          <label class="check-label">
            <input type="radio" name="gender" value="Female"> Female
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="course">Course:</label>
        <select id="course" name="course">
          <option value="BSCS" selected>BSCS</option>
          <option value="BSIT">BSIT</option>
          <option value="BSIS">BSIS</option>
          <option value="BSCPE">BSCPE</option>
        </select>
      </div>

      <div class="form-group">
        <label>Skills:</label>
        <div class="inline-group">
          <label class="check-label">
            <input type="checkbox" name="skill" value="HTML"> HTML
          </label>
          <label class="check-label">
            <input type="checkbox" name="skill" value="CSS"> CSS
          </label>
          <label class="check-label">
            <input type="checkbox" name="skill" value="JavaScript"> JavaScript
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="uploadFile">Upload File:</label>
        <div class="file-upload-box">
          <input type="file" id="uploadFile" name="uploadFile">
        </div>
      </div>

      <button type="submit" class="btn-submit">Submit Registration</button>

    </form>
  </div>

  <footer class="site-footer">
    <p>Copyright@2026</p>
  </footer>

</body>
</html>
