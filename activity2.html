<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Information Website | Michael Luis T. Ramos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* Design System Variables */
    :root {
      --bg-base: #0b1220;
      --bg-surface: #131e32;
      --bg-nav: rgba(19, 30, 50, 0.8);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --border-color: rgba(255, 255, 255, 0.1);
      --font-body: 'DM Sans', sans-serif;
      --font-heading: 'Manrope', sans-serif;
      --transition: 0.3s ease;
    }

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-base);
      color: var(--text-main);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header Section */
    .site-header {
      background: var(--bg-surface);
      padding: 4rem 2rem;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
    }

    .site-header h1 {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .site-header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* Navigation Menu */
    .site-nav {
      background: var(--bg-nav);
      backdrop-filter: blur(10px);
      padding: 1rem 0;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-links {
      display: flex;
      justify-content: center;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 500;
      transition: color var(--transition);
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    /* Active state for the current page */
    .nav-links .active {
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.3rem 1rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
    }

    /* Main Content & Profile Card */
    .main-content {
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center; /* Centered vertically and horizontally */
      padding: 4rem 1rem;
    }

    .profile-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      width: 100%;
      max-width: 450px;
      padding: 3rem 2.5rem;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .profile-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.5);
      border-color: var(--accent);
    }

    /* Profile Image with subtle glow */
    .profile-image-container {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 0 auto 1.5rem auto;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, var(--accent), transparent);
    }

    .profile-image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid var(--bg-surface);
    }

    .profile-card h2 {
      font-family: var(--font-heading);
      color: var(--text-main);
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }

    .profile-card p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }

    /* Learn More Button */
    .btn-learn-more {
      display: inline-block;
      background-color: var(--accent);
      color: #ffffff;
      text-decoration: none;
      padding: 0.8rem 2.5rem;
      border-radius: 50px;
      font-weight: 600;
      font-family: var(--font-body);
      font-size: 1rem;
      transition: background-color var(--transition), transform var(--transition);
    }

    .btn-learn-more:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
    }

    /* Footer */
    .site-footer {
      text-align: center;
      padding: 2rem 0;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Responsive Design */
    @media (max-width: 600px) {
      .nav-links {
        flex-wrap: wrap;
      }
      .site-header h1 {
        font-size: 1.8rem;
      }
      .profile-card {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <h1>Hello, My Name is Michael Luis T. Ramos</h1>
      <p>Welcome to My Personal Information Website</p>
    </div>
  </header>

  <!-- Navigation -->
  <nav class="site-nav">
    <div class="container">
      <ul class="nav-links">
        <!-- Notice the 'active' class is on the Home link -->
        <li><a href="index.html">Home</a></li>
        <li><a href="register.html">Registration Form</a></li>
        <li><a href="tables2.html">Tables</a></li>
      </ul>
    </div>
  </nav>

  <!-- Main Profile Card Area -->
  <main class="main-content">
    <div class="profile-card">
      
      <div class="profile-image-container">
        <!-- Make sure you have your image saved in the assets folder -->
        <img src="2.png" alt="Profile Picture of Michael Luis T. Ramos">
      </div>
      
      <h2>Michael Luis T. Ramos</h2>
      <p>Hi! Welcome to my webpage. This website contains my personal information, registration form, tables, and profile.</p>
      
      <a href="profile.html" class="btn-learn-more">Learn More</a>
      
    </div>
  </main>

  <footer class="site-footer">
    <p>Copyright@2026</p>
  </footer>

</body>
</html>
