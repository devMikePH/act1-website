<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity 1 | Michael Luis T. Ramos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* Design System Variables */
    :root {
      --bg-base: #0b1220;
      --bg-surface: #131e32;
      --bg-nav: rgba(19, 30, 50, 0.8);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border-color: rgba(255, 255, 255, 0.1);
      --font-body: 'DM Sans', sans-serif;
      --font-heading: 'Manrope', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-base);
      color: var(--text-main);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header */
    .hero-header {
      background: var(--bg-surface);
      padding: 4rem 2rem;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
    }

    .hero-header h1 {
      font-family: var(--font-heading);
      font-size: 2.5rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .hero-header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* Navigation */
    .site-nav {
      background: var(--bg-nav);
      backdrop-filter: blur(10px);
      padding: 1rem 0;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-links {
      display: flex;
      justify-content: center;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    .nav-links .active {
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.3rem 1rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
    }

    /* Main Layout */
    .content-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2rem;
      padding: 3rem 0;
      flex-grow: 1;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .card h2, .card h3 {
      font-family: var(--font-heading);
      color: var(--text-main);
      margin-bottom: 1rem;
    }

    .card p {
      color: var(--text-muted);
    }

    /* Footer */
    .site-footer {
      text-align: center;
      padding: 2rem 0;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .content-grid {
        grid-template-columns: 1fr;
      }
      .nav-links {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>

  <header class="hero-header">
    <div class="container">
      <h1>Hello My Name is Michael Luis T. Ramos</h1>
      <p>This is my Information</p>
    </div>
  </header>

  <nav class="site-nav">
  <div class="container">
    <ul class="nav-links">
      <li><a href="activity1.html">Home</a></li>
      <li><a href="registerform.html">Registration Form</a></li>
      <li><a href="tables.html">Tables</a></li>
      <li><a href="profile.html">My Profile</a></li>
    </ul>
  </div>
</nav>

  <div class="container content-grid">
    <main class="card">
      <h2>This is the Main content</h2>
      <p>This is the sample</p>
    </main>

    <aside class="card">
      <h3>Sample Website</h3>
      <p>This is side content</p>
    </aside>
  </div>

  <footer class="site-footer">
    <p>Copyright@2026</p>
  </footer>

</body>
</html>
